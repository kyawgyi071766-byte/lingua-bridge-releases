name: Build test installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: Deployed Lingua HTTPS URL
        required: false
        default: https://lingua-github-import.vercel.app
        type: string

permissions:
  contents: read

concurrency:
  group: lingua-bridge-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_URL: ${{ inputs.server_url || 'https://lingua-github-import.vercel.app' }}
  SOURCE_DIR: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source

jobs:
  quality-gate:
    name: Web production build and release audits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - run: npm ci
      - run: npm run audit:static
      - run: npm run audit:gemini
      - run: npm run audit:public-release
      - run: node desktop-bridge/scripts/copy-message-regression.cjs
      - run: node desktop-bridge/scripts/multi-app-adapter-regression.cjs
      - run: node desktop-bridge/scripts/webview-settings-regression.cjs
      - run: node desktop-bridge/scripts/electron-security-regression.cjs
      - run: npm run build

  android:
    if: github.event_name != 'pull_request'
    name: Android test APK
    needs: quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-android-test-apk
          retention-days: 14
          path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    if: github.event_name != 'pull_request'
    name: Windows installer
    needs: quality-gate
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - run: npm ci
      - shell: pwsh
        run: npm run electron:build:win
      - name: Publish Windows installer only
        uses: actions/upload-artifact@v4
        with:
          name: lingua-windows-installer-v1.0.35
          retention-days: 14
          path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/dist-electron/*.exe
          if-no-files-found: error

  desktop-bridge-windows:
    name: Lingua Bridge desktop Windows installer
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/desktop-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/desktop-bridge/package-lock.json
      - run: npm ci
      - run: npm run qa
      - run: npm run build:win:public
      - name: Publish Lingua Bridge desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: lingua-bridge-desktop-windows-v1.0.36
          retention-days: 14
          path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/desktop-bridge/release-v1.0.36-public/*.exe
          if-no-files-found: error

  linux:
    if: github.event_name != 'pull_request'
    name: Linux installers
    needs: quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - run: npm ci
      - run: npm run electron:build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-linux
          retention-days: 14
          path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/dist-electron/**

  macos:
    if: github.event_name != 'pull_request'
    name: macOS test DMG
    needs: quality-gate
    runs-on: macos-14
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - run: npm ci
      - run: npm run electron:build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-macos-test
          retention-days: 14
          path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/dist-electron/**

  ios-simulator:
    if: github.event_name != 'pull_request'
    name: iOS simulator build
    needs: quality-gate
    runs-on: macos-14
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - run: npm ci
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Release-iphonesimulator/App.app lingua-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-ios-simulator
          retention-days: 14
          path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/lingua-ios-simulator.zip

  publish-desktop-1-0-36:
    name: Publish verified Windows 1.0.36 release
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: publish 1.0.36')
    needs: desktop-bridge-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lingua-bridge-desktop-windows-v1.0.36
          path: installer
      - name: Verify installer and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd installer
          test -s Lingua-Bridge-Setup-1.0.36.exe
          python3 -c "from pathlib import Path; p=Path('Lingua-Bridge-Setup-1.0.36.exe'); assert p.stat().st_size > 1000000; assert p.open('rb').read(2) == b'MZ'"
          sha256sum Lingua-Bridge-Setup-1.0.36.exe > SHA256SUMS.txt
          if gh release view v1.0.36 >/dev/null 2>&1; then
            gh release upload v1.0.36 Lingua-Bridge-Setup-1.0.36.exe SHA256SUMS.txt --clobber
            gh release edit v1.0.36 --target "$RELEASE_COMMIT" --notes "Windows x64 installer. Includes visible chat history translation opt-in fix, multi-app outgoing translation, and Electron WebView hardening. CI web audits and desktop QA passed before publication."
          else
            gh release create v1.0.36 Lingua-Bridge-Setup-1.0.36.exe SHA256SUMS.txt --target "$RELEASE_COMMIT" --title "Lingua Bridge v1.0.36" --notes "Windows x64 installer. Includes visible chat history translation opt-in fix. CI audits and desktop QA passed."
          fi
