name: DNSExit SMTP OTP branch QA

on:
  push:
    branches:
      - feat/dnsexit-smtp-otp

permissions:
  contents: read

concurrency:
  group: dnsexit-smtp-branch-qa
  cancel-in-progress: true

jobs:
  test:
    name: SMTP / OTP security + Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Lingua-Bridge-v1.0.35-UNREAD-ACCURACY-CANDIDATE-source/package-lock.json
      - run: npm ci
      - run: npm run audit:static
      - run: npm run build
